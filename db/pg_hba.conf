# Control de acceso de PostgreSQL (pg_hba.conf) de Canario.
#
# La imagen oficial trae por defecto reglas "trust" (acceso sin contraseña
# desde el propio contenedor, por el socket Unix y por loopback; el resto de
# orígenes ya exigía contraseña). Este fichero las sustituye por completo: el
# servidor se arranca con
# "-c hba_file=/etc/postgresql/pg_hba.conf" y el pg_hba.conf que la imagen
# deja dentro de PGDATA queda inerte.
#
# PostgreSQL evalúa las reglas de arriba abajo y aplica la primera que
# encaja. El orden importa.

# Regla 1: el superusuario solo entra por el socket Unix local, y solo si el
# usuario del sistema operativo también se llama postgres (peer). Es la vía
# de mantenimiento y de los healthchecks; no hay acceso de superusuario por red.
# TYPE  DATABASE  USER      ADDRESS  METHOD
local   all       postgres           peer

# Regla 2: los tres roles de Canario solo entran a la base canario por red,
# con contraseña (scram-sha-256). "samenet" limita el origen a las direcciones
# de la propia subred del servidor, que es la red interna data: nada que no
# esté conectado a ella puede ni intentar autenticarse. samenet también
# incluye el loopback (comprobado): desde dentro de este contenedor se puede
# intentar, con contraseña (docs/threat-model.md, 8).
# TYPE  DATABASE  USER                           ADDRESS  METHOD
host    canario   migrador,aplicacion,plataforma  samenet  scram-sha-256

# Regla 3: cualquier otro acceso por socket Unix se rechaza.
# TYPE  DATABASE  USER  ADDRESS  METHOD
local   all       all            reject

# Regla 4: cualquier otro acceso por red se rechaza. PostgreSQL ya deniega lo
# que no encaja con ninguna regla, pero lo dejamos escrito de forma explícita:
# así la intención queda a la vista y un error de edición no abre nada sin
# que se note.
# TYPE  DATABASE  USER  ADDRESS  METHOD
host    all       all   all      reject

name: canario

services:
  redis:
    # Imagen fijada por versión y por digest: la versión es legible para humanos
    # y el digest garantiza que el contenido es exactamente el que revisamos,
    # aunque alguien republique la etiqueta (defensa ante cadena de suministro).
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Usuario sin privilegios: si el proceso se compromete, no es root dentro
    # del contenedor.
    user: redis
    restart: unless-stopped
    command:
      - redis-server
      # Persistencia desactivada (save "" y appendonly no): Redis solo guarda
      # contadores efímeros del limitador. Nada sensible debe llegar a disco.
      - --save
      - ""
      - --appendonly
      - "no"
      # Tope de memoria: evita que un abuso agote la RAM del host.
      - --maxmemory
      - 64mb
      # noeviction: los contadores del limitador nunca se expulsan en silencio.
      # Si la memoria se llena, Redis devuelve error y la API falla cerrada
      # (rechaza la petición) en vez de dejar pasar tráfico sin límite.
      - --maxmemory-policy
      - noeviction
      # Solo avisos y errores, para no llenar los logs de ruido.
      - --loglevel
      - warning
      # La ACL (generada por scripts/generar_secretos.py) define el usuario
      # aplicacion, con su contraseña hasheada y sus permisos, y desactiva el
      # usuario default.
      - --aclfile
      - /run/secrets/redis_acl
    # Sistema de ficheros raíz de solo lectura. Incluye /data, porque la imagen
    # no declara ningún volumen. Así ni SAVE ni BGSAVE pueden escribir a disco,
    # y un atacante no puede dejar ficheros dentro del contenedor.
    read_only: true
    # Sin ninguna capability de Linux: Redis no necesita ninguna.
    cap_drop:
      - ALL
    # Impide ganar privilegios nuevos (por ejemplo con binarios setuid).
    security_opt:
      - no-new-privileges:true
    # Límites de recursos: contienen el daño de un fallo o de un abuso.
    mem_limit: 128m
    pids_limit: 64
    # Sin puertos publicados (no hay clave "ports"): Redis solo es accesible
    # desde otros contenedores conectados a la red cache.
    # Autenticación por ACL: el usuario default está desactivado y solo existe
    # el usuario aplicacion, con una lista explícita de comandos y acceso
    # únicamente a las claves limite:*. Los módulos de la imagen (RedisJSON,
    # RediSearch, RedisBloom, RedisTimeSeries) siguen cargados, pero sus
    # comandos quedan denegados por la ACL.
    secrets:
      - contrasena_redis
      - redis_acl
    networks:
      - cache
    healthcheck:
      # redis-cli sale con 0 aunque falle la autenticación (NOAUTH, WRONGPASS,
      # NOPERM), así que solo es sano si la respuesta es exactamente PONG. La
      # contraseña se lee del fichero y se pasa por entorno, no como argumento,
      # para que no aparezca en la línea de comandos del proceso.
      test: ["CMD-SHELL", "x=$$(REDISCLI_AUTH=$$(cat /run/secrets/contrasena_redis) redis-cli --user aplicacion ping); case $$x in PONG) exit 0;; *) exit 1;; esac"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Rotación de logs: evita que crezcan sin límite y llenen el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # Imagen fijada por versión y por digest, por el mismo motivo que redis
    # (defensa ante cadena de suministro).
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # Usuario sin privilegios desde el primer proceso (70 es postgres en la
    # imagen alpine): el contenedor nunca arranca como root.
    user: "70:70"
    restart: unless-stopped
    # Con datos persistentes el apagado necesita margen para el checkpoint;
    # los 10 s por defecto son pocos.
    stop_grace_period: 30s
    command:
      - postgres
      # pg_hba propio: sustituye al de la imagen, que trae reglas trust. El
      # que la imagen deja en PGDATA queda inerte mientras se use hba_file.
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      # Escucha en todas las interfaces del contenedor; el acceso lo limitan
      # la red interna data y las reglas de pg_hba.conf.
      - -c
      - listen_addresses=*
      # El entrypoint de la imagen cambia el modo del directorio del socket
      # (comprobado: queda drwxrwsr-t), así que "mode" en el tmpfs no sirve.
      # La protección real es el permiso del propio fichero del socket, al que
      # solo puede conectarse el usuario postgres.
      - -c
      - unix_socket_permissions=0700
      # Las contraseñas nuevas se guardan con SCRAM-SHA-256, no con MD5.
      - -c
      - password_encryption=scram-sha-256
      # ssl=off es un límite asumido: la red data es interna y el contenido
      # sensible ya llega cifrado desde la aplicación.
      - -c
      - ssl=off
      # Cada conexión es un proceso, así que max_connections=20 y pids_limit 64
      # son coherentes: el contenedor no puede agotar los procesos antes de
      # llegar al tope de conexiones.
      - -c
      - max_connections=20
      # Sin trazas de conexiones ni de nombres de host: el log no debe
      # acumular quién se conecta ni desde dónde.
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_hostname=off
      - -c
      - log_statement=none
      # panic evita que un error vuelque al log el texto de la consulta, que
      # podría contener datos sensibles.
      - -c
      - log_min_error_statement=panic
    environment:
      POSTGRES_DB: canario
      # La contraseña del superusuario se lee de un secreto de fichero, no de
      # una variable de entorno visible con docker inspect.
      POSTGRES_PASSWORD_FILE: /run/secrets/contrasena_postgres_superusuario
    secrets:
      - contrasena_postgres_superusuario
      # Contraseñas de los roles de login: solo las lee el script de
      # inicialización db/init/01_roles.sh.
      - contrasena_migrador
      - contrasena_aplicacion
      - contrasena_plataforma
    # Sistema de ficheros raíz de solo lectura: lo único escribible son los
    # volúmenes y los tmpfs de abajo.
    read_only: true
    tmpfs:
      # Temporales en memoria, sin ejecución ni setuid.
      - /tmp:rw,noexec,nosuid,size=64m
      # Socket Unix en memoria. El modo del directorio lo fija el entrypoint de
      # la imagen y el acceso al socket lo restringe unix_socket_permissions.
      - /var/run/postgresql:rw,noexec,nosuid,uid=70,gid=70,size=8m
    volumes:
      # A diferencia de redis, los datos de PostgreSQL sí persisten.
      - pgdata:/var/lib/postgresql
      # Reglas de acceso propias, en solo lectura.
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # Scripts de inicialización de la imagen: solo se ejecutan con el volumen
      # vacío, y se montan en solo lectura.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Sin ninguna capability de Linux.
    cap_drop:
      - ALL
    # Impide ganar privilegios nuevos (por ejemplo con binarios setuid).
    security_opt:
      - no-new-privileges:true
    # Límites de recursos: contienen el daño de un fallo o de un abuso.
    mem_limit: 512m
    pids_limit: 64
    # Sin puertos publicados (no hay clave "ports"): PostgreSQL solo es
    # accesible desde otros contenedores conectados a la red data.
    networks:
      - data
    healthcheck:
      # pg_isready da OK aunque pg_hba rechace la conexión. Aquí solo es sano
      # si el servidor responde por el socket, escucha ya por TCP (lo que
      # descarta el servidor temporal de la inicialización de la imagen) y
      # existen los cuatro roles y el esquema (se usa la tabla centinela
      # registro_auditoria). Así, si el script de inicialización falla y el
      # contenedor se reinicia, la imagen se salta los scripts sin aviso (el
      # volumen ya no está vacío) y este healthcheck deja el estado visible como
      # unhealthy. Como el esquema se aplica en una sola transacción, existe
      # entero o no existe. La lista de roles y el centinela están también en
      # db/init y deben mantenerse iguales. No se suprime stderr para que el
      # fallo quede visible en el historial del healthcheck.
      test:
        - CMD-SHELL
        - |
          x=$$(psql -U postgres -d canario -Atc "select current_setting('listen_addresses') || '|' || (select count(*) from pg_roles where rolname in ('migrador','aplicacion','plataforma','propietario_funciones')) || '|' || (to_regclass('canal.registro_auditoria') is not null)::text")
          case $$x in '*|4|true') exit 0;; *) exit 1;; esac
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Rotación de logs: evita que crezcan sin límite y llenen el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cache:
    # Red interna: los contenedores no tienen salida a internet ni son
    # accesibles desde fuera del host.
    internal: true
  data:
    # Red interna de la base de datos: sin salida a internet ni acceso desde
    # fuera del host. Solo los servicios que la necesitan se conectan a ella.
    internal: true

secrets:
  contrasena_redis:
    file: ./secrets/contrasena_redis.txt
  redis_acl:
    file: ./secrets/redis_acl.conf
  contrasena_postgres_superusuario:
    file: ./secrets/contrasena_postgres_superusuario.txt
  contrasena_migrador:
    file: ./secrets/contrasena_migrador.txt
  contrasena_aplicacion:
    file: ./secrets/contrasena_aplicacion.txt
  contrasena_plataforma:
    file: ./secrets/contrasena_plataforma.txt

volumes:
  # Persiste entre reinicios, a diferencia de redis. Los scripts de
  # inicialización de la imagen solo se ejecutan cuando el volumen está vacío.
  pgdata:

name: canario

services:
  redis:
    # Imagen fijada por versión y por digest: la versión es legible para humanos
    # y el digest garantiza que el contenido es exactamente el que revisamos,
    # aunque alguien republique la etiqueta (defensa ante cadena de suministro).
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Usuario sin privilegios: si el proceso se compromete, no es root dentro
    # del contenedor.
    user: redis
    restart: unless-stopped
    command:
      - redis-server
      # Persistencia desactivada (save "" y appendonly no): Redis solo guarda
      # contadores efímeros del limitador. Nada sensible debe llegar a disco.
      - --save
      - ""
      - --appendonly
      - "no"
      # Tope de memoria: evita que un abuso agote la RAM del host.
      - --maxmemory
      - 64mb
      # noeviction: los contadores del limitador nunca se expulsan en silencio.
      # Si la memoria se llena, Redis devuelve error y la API falla cerrada
      # (rechaza la petición) en vez de dejar pasar tráfico sin límite.
      - --maxmemory-policy
      - noeviction
      # Solo avisos y errores, para no llenar los logs de ruido.
      - --loglevel
      - warning
      # La ACL (generada por scripts/generar_secretos.py) define el usuario
      # aplicacion, con su contraseña hasheada y sus permisos, y desactiva el
      # usuario default.
      - --aclfile
      - /run/secrets/redis_acl
    # Sistema de ficheros raíz de solo lectura. Incluye /data, porque la imagen
    # no declara ningún volumen. Así ni SAVE ni BGSAVE pueden escribir a disco,
    # y un atacante no puede dejar ficheros dentro del contenedor.
    read_only: true
    # Sin ninguna capability de Linux: Redis no necesita ninguna.
    cap_drop:
      - ALL
    # Impide ganar privilegios nuevos (por ejemplo con binarios setuid).
    security_opt:
      - no-new-privileges:true
    # Límites de recursos: contienen el daño de un fallo o de un abuso.
    mem_limit: 128m
    pids_limit: 64
    # Sin puertos publicados (no hay clave "ports"): Redis solo es accesible
    # desde otros contenedores conectados a la red cache.
    # Autenticación por ACL: el usuario default está desactivado y solo existe
    # el usuario aplicacion, con una lista explícita de comandos y acceso
    # únicamente a las claves limite:*. Los módulos de la imagen (RedisJSON,
    # RediSearch, RedisBloom, RedisTimeSeries) siguen cargados, pero sus
    # comandos quedan denegados por la ACL.
    secrets:
      - contrasena_redis
      - redis_acl
    networks:
      - cache
    healthcheck:
      # redis-cli sale con 0 aunque falle la autenticación (NOAUTH, WRONGPASS,
      # NOPERM), así que solo es sano si la respuesta es exactamente PONG. La
      # contraseña se lee del fichero y se pasa por entorno, no como argumento,
      # para que no aparezca en la línea de comandos del proceso.
      test: ["CMD-SHELL", "x=$$(REDISCLI_AUTH=$$(cat /run/secrets/contrasena_redis) redis-cli --user aplicacion ping); case $$x in PONG) exit 0;; *) exit 1;; esac"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Rotación de logs: evita que crezcan sin límite y llenen el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # Imagen propia (db/Dockerfile) sobre postgres:18.6-alpine fijada por
    # versión y por digest, por el mismo motivo que redis (defensa ante cadena
    # de suministro). Solo quita gosu, que este despliegue nunca ejecuta y que
    # arrastraba vulnerabilidades de su compilador de Go.
    build:
      context: ./db
    # Usuario sin privilegios desde el primer proceso (70 es postgres en la
    # imagen alpine): el contenedor nunca arranca como root.
    user: "70:70"
    restart: unless-stopped
    # Con datos persistentes el apagado necesita margen para el checkpoint;
    # los 10 s por defecto son pocos.
    stop_grace_period: 30s
    command:
      - postgres
      # pg_hba propio: sustituye al de la imagen, que trae reglas trust. El
      # que la imagen deja en PGDATA queda inerte mientras se use hba_file.
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      # Escucha en todas las interfaces del contenedor; el acceso lo limitan
      # la red interna data y las reglas de pg_hba.conf.
      - -c
      - listen_addresses=*
      # El entrypoint de la imagen cambia el modo del directorio del socket
      # (comprobado: queda drwxrwsr-t), así que "mode" en el tmpfs no sirve.
      # La protección real es el permiso del propio fichero del socket, al que
      # solo puede conectarse el usuario postgres.
      - -c
      - unix_socket_permissions=0700
      # Las contraseñas nuevas se guardan con SCRAM-SHA-256, no con MD5.
      - -c
      - password_encryption=scram-sha-256
      # ssl=off es un límite asumido: la red data es interna y el contenido
      # sensible ya llega cifrado desde la aplicación.
      - -c
      - ssl=off
      # Cada conexión es un proceso, así que max_connections=20 y pids_limit 64
      # son coherentes: el contenedor no puede agotar los procesos antes de
      # llegar al tope de conexiones.
      - -c
      - max_connections=20
      # Sin trazas de conexiones ni de nombres de host: el log no debe
      # acumular quién se conecta ni desde dónde.
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_hostname=off
      - -c
      - log_statement=none
      # panic evita que un error vuelque al log el texto de la consulta, que
      # podría contener datos sensibles.
      - -c
      - log_min_error_statement=panic
      # terse: el log del servidor no lleva DETAIL, HINT, QUERY ni CONTEXT. Un
      # DETAIL repite valores de la fila (por ejemplo "Key (codigo_hmac)=(...)"
      # en un duplicado o la fila entera en un CHECK). Solo cambia el log del
      # servidor: el cliente sigue recibiendo el error completo.
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_DB: canario
      # La contraseña del superusuario se lee de un secreto de fichero, no de
      # una variable de entorno visible con docker inspect.
      POSTGRES_PASSWORD_FILE: /run/secrets/contrasena_postgres_superusuario
    secrets:
      - contrasena_postgres_superusuario
      # Contraseñas de los roles de login: solo las lee el script de
      # inicialización db/init/01_roles.sh.
      - contrasena_migrador
      - contrasena_aplicacion
      - contrasena_plataforma
    # Sistema de ficheros raíz de solo lectura: lo único escribible son los
    # volúmenes y los tmpfs de abajo.
    read_only: true
    tmpfs:
      # Temporales en memoria, sin ejecución ni setuid.
      - /tmp:rw,noexec,nosuid,size=64m
      # Socket Unix en memoria. El modo del directorio lo fija el entrypoint de
      # la imagen y el acceso al socket lo restringe unix_socket_permissions.
      - /var/run/postgresql:rw,noexec,nosuid,uid=70,gid=70,size=8m
    volumes:
      # A diferencia de redis, los datos de PostgreSQL sí persisten.
      - pgdata:/var/lib/postgresql
      # Reglas de acceso propias, en solo lectura.
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # Scripts de inicialización de la imagen: solo se ejecutan con el volumen
      # vacío, y se montan en solo lectura.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Sin ninguna capability de Linux.
    cap_drop:
      - ALL
    # Impide ganar privilegios nuevos (por ejemplo con binarios setuid).
    security_opt:
      - no-new-privileges:true
    # Límites de recursos: contienen el daño de un fallo o de un abuso.
    mem_limit: 512m
    pids_limit: 64
    # Sin puertos publicados (no hay clave "ports"): PostgreSQL solo es
    # accesible desde otros contenedores conectados a la red data.
    networks:
      - data
    healthcheck:
      # pg_isready da OK aunque pg_hba rechace la conexión. Aquí solo es sano
      # si el servidor responde por el socket, escucha ya por TCP (lo que
      # descarta el servidor temporal de la inicialización de la imagen) y
      # existen los seis roles y lo último que crea la inicialización (se usa
      # como centinela la función redactar_mensaje, la última del último
      # script, 05_redaccion.sql). Así, si un script de inicialización falla y
      # el contenedor se reinicia, la imagen se salta los scripts sin aviso (el
      # volumen ya no está vacío) y este healthcheck deja el estado visible
      # como unhealthy. Cada script se aplica en una sola transacción y en
      # orden, y la inicialización se detiene en el primero que falla: si
      # existe el centinela del último, se aplicaron todos. La lista de roles y
      # el centinela están también en db/init y deben mantenerse iguales. No se
      # suprime stderr para que el fallo quede visible en el historial del
      # healthcheck.
      # Dos pasos: primero, en la base postgres (que siempre existe), si el
      # servidor escucha ya por TCP. El servidor temporal de la inicialización
      # arranca con listen_addresses='' (docker-entrypoint.sh de la imagen) y
      # todavía no ha creado canario: preguntarle por canario dejaba en el log
      # un FATAL "database canario does not exist" si la comprobación caía en
      # esa ventana. Solo con el servidor real se consulta canario.
      test:
        - CMD-SHELL
        - |
          l=$$(psql -U postgres -d postgres -Atc "select current_setting('listen_addresses')") || exit 1
          [ -n "$$l" ] || exit 1
          x=$$(psql -U postgres -d canario -Atc "select current_setting('listen_addresses') || '|' || (select count(*) from pg_roles where rolname in ('migrador','aplicacion','plataforma','propietario_funciones','propietario_supresion','propietario_redaccion')) || '|' || (to_regprocedure('canal.redactar_mensaje(uuid,integer,uuid,bytea,bytea,integer)') is not null)::text")
          case $$x in '*|6|true') exit 0;; *) exit 1;; esac
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Rotación de logs: evita que crezcan sin límite y llenen el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Imagen propia (Dockerfile de la raíz) sobre python:3.12-slim fijada por
    # digest. Usuario 10001 sin privilegios, declarado en la imagen.
    build:
      context: .
    restart: unless-stopped
    # Al arrancar, la API verifica la base de datos (roles, RLS, permisos y
    # políticas) y se niega a arrancar si algo no coincide. Para eso necesita
    # PostgreSQL ya inicializado: su healthcheck comprueba roles y esquema.
    # Después verifica Redis (autenticación y ACL, app/limitador.py): sin
    # limitador no sirve ninguna petición.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Se añade al ENTRYPOINT de la imagen (que ya fija --no-access-log y
    # --no-server-header).
    # --host: uvicorn escucha solo en la IP fija de la API en la red app, la
    # única por la que llega el proxy. En data, cache y correo la API es
    # cliente y no escucha: un vecino de esas redes que se viera comprometido
    # (PostgreSQL, Redis, el SMTP) no puede hablarle saltándose el proxy y sus
    # cabeceras. uvicorn acepta una sola dirección (comprobado con su --help).
    # Solo se confía en las cabeceras de reenvío que vengan de la IP fija del
    # proxy en la red app; nunca "*". Sin esto, todos los clientes parecerían
    # el proxy y compartirían un único contador de rate limit; con "*",
    # cualquiera podría falsificar su IP.
    command:
      - --host
      - 10.88.0.4
      - --proxy-headers
      - --forwarded-allow-ips
      - 10.88.0.2
    # Sistema de ficheros raíz de solo lectura. No hace falta tmpfs: la API no
    # escribe en disco (PYTHONDONTWRITEBYTECODE en la imagen).
    read_only: true
    # Sin ninguna capability de Linux.
    cap_drop:
      - ALL
    # Impide ganar privilegios nuevos (por ejemplo con binarios setuid).
    security_opt:
      - no-new-privileges:true
    # Límites de recursos: contienen el daño de un fallo o de un abuso.
    mem_limit: 256m
    pids_limit: 64
    # Sin puertos publicados: solo se llega a la API a través del proxy (red
    # app). En data habla con PostgreSQL; pg_hba.conf solo admite su subred
    # (samenet). En cache habla con Redis, el del limitador de peticiones. En
    # correo, con el servidor SMTP de desarrollo (mailpit, app/correo.py).
    networks:
      app:
        # IP fija: es en la que escucha uvicorn (--host, arriba). Está en el
        # tramo reservado para IPs fijas (de .2 a .7; ver la red app): la .2 es
        # del proxy y la .3 la usa el cliente directo de las baterías.
        ipv4_address: 10.88.0.4
      data: {}
      cache: {}
      correo: {}
      # En canje la API es solo cliente del broker y no escucha (--host es la
      # IP de app): si el broker cae, no tiene a quién hablarle. IP fija porque
      # el broker solo atiende a la .4 (CANARIO_IP_API del broker).
      canje:
        ipv4_address: 10.88.2.4
    # Origen de la SPA del personal (el 8445 de caddy): los enlaces de los
    # correos del registro apuntan a él (app/solicitudes.py), y es el único
    # Origin que la API acepta en una petición del navegador con cookies
    # (app/rutas_personal.py). Obligatorio y explícito, sin valor por defecto
    # en el código: un enlace con un secreto no puede apuntar a un sitio que
    # nadie eligió. El ancla lo comparte con el broker, que construye con él la
    # redirect_uri de los proveedores externos: un solo valor, no dos copias
    # que puedan divergir.
    environment:
      CANARIO_ORIGEN_PERSONAL: &origen_personal "https://localhost:8445"
    # Secretos como ficheros en /run/secrets, nunca como variables de entorno:
    # la contraseña del rol aplicacion (se lee en cada conexión nueva), la
    # clave maestra (desenvuelve las claves de cada empresa), la clave del
    # HMAC de los códigos de seguimiento, la que firma los JWT de acceso del
    # personal, la del HMAC de las identidades externas vinculadas, la que
    # cifra las cookies del login externo y la contraseña del usuario
    # aplicacion de Redis (también se lee en cada conexión nueva). Sin
    # contrasena_plataforma: la API no puede dar de alta empresas. Sin los
    # client_secret de los proveedores: solo los tiene el broker.
    # Sin variable CANARIO_LIMITES: la API usa los límites de producción de
    # app/limitador.py y los registra al arrancar.
    secrets:
      - contrasena_aplicacion
      - clave_maestra
      - clave_hmac_codigos
      - clave_firma_tokens
      - clave_hmac_identidades
      - clave_flujo_externo
      - contrasena_redis
    healthcheck:
      # Sin curl: un script de la propia imagen que solo da sano con 200 y el
      # cuerpo exacto {"estado":"ok"}. El motivo del fallo queda en stderr.
      # Contra la IP de --host: en 127.0.0.1 uvicorn ya no escucha.
      test: ["CMD", "python", "-m", "app.comprobar_salud", "10.88.0.4"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Rotación de logs: evita que crezcan sin límite y llenen el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  broker:
    # Canje con los proveedores de identidad externos (app/broker.py): el
    # único servicio con salida a internet, para que la API, que guarda las
    # claves de Canario, siga sin ella (docs/threat-model.md, 6.19). Misma
    # imagen que la API con otro punto de entrada, como gestion: una sola
    # imagen que fijar y escanear.
    build:
      context: .
    entrypoint: ["uvicorn", "app.broker:aplicacion", "--port", "8000", "--no-access-log", "--no-server-header"]
    # Solo en su IP de canje: en salida, la red con internet, no escucha.
    command: ["--host", "10.88.2.3"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 32
    networks:
      canje:
        ipv4_address: 10.88.2.3
      salida: {}
    environment:
      CANARIO_ORIGEN_PERSONAL: *origen_personal
      # La única IP a la que atiende (además de su propio healthcheck).
      CANARIO_IP_API: "10.88.2.4"
    # Solo la configuración de los proveedores. Ninguna clave de Canario ni
    # acceso a la base de datos: si cae el broker, eso no se pierde.
    secrets:
      - google_client_id
      - google_client_secret
    healthcheck:
      test: ["CMD", "python", "-m", "app.comprobar_salud", "10.88.2.3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gestion:
    # Operaciones de administración (alta de empresas y claves de cifrado,
    # app/gestion.py), fuera de la API pública. Misma imagen que la API con
    # otro punto de entrada. El perfil hace que "docker compose up" no lo
    # arranque nunca: solo se ejecuta a mano con
    # "docker compose run --rm gestion <orden>".
    build:
      context: .
    profiles:
      - gestion
    entrypoint: ["python", "-m", "app.gestion"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # Mismo endurecimiento que la API.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 32
    # Solo la red de la base de datos: ni proxy, ni Redis, ni internet.
    networks:
      - data
    # Es el único servicio con el secreto de plataforma (alta de empresas).
    # Tiene el de aplicacion para guardar la clave de la empresa nueva con su
    # contexto, y la clave maestra para envolverla. No necesita la del HMAC.
    secrets:
      - contrasena_plataforma
      - contrasena_aplicacion
      - clave_maestra
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    # Servidor SMTP de DESARROLLO: recibe los correos del registro del personal
    # y no los entrega a nadie (app/correo.py). El perfil hace que
    # "docker compose up" no lo arranque: se pide con --profile desarrollo.
    # Sin él, cada correo deja EVENTO correo_fallido en el log de la API. La
    # salida SMTP de producción no está decidida (docs/threat-model.md).
    # Imagen fijada por versión y por digest, como el resto.
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    profiles:
      - desarrollo
    restart: unless-stopped
    # La imagen arranca como root: aquí, un usuario sin privilegios propio
    # (10003, sin cuenta en la imagen; Mailpit no la necesita). Los puertos
    # 1025 y 8025 no son privilegiados.
    user: "10003:10003"
    # Sistema de ficheros raíz de solo lectura. Mailpit guarda los mensajes
    # en una base de datos temporal en /tmp: en memoria, sin ejecución ni
    # setuid, y se pierde al parar (son correos de prueba).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    # Solo la red interna correo: sin salida a internet (un correo de prueba
    # nunca puede llegar a un buzón real) y sin puertos publicados (una red
    # interna no puede publicarlos). Los mensajes se leen con su API HTTP
    # (puerto 8025) desde un contenedor en la misma red: docs/api.md, sección
    # Registro del personal y correo de desarrollo.
    networks:
      - correo
    # Sin healthcheck propio: la imagen trae el suyo (/mailpit readyz).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # Imagen propia (proxy/Dockerfile) sobre caddy:2.11.7-alpine fijada por
    # digest: sin la file capability del binario, /data/caddy solo para el
    # usuario 10002 y el Caddyfile dentro de la imagen. La SPA del personal se
    # compila en una primera etapa con Node, que no llega a la imagen final.
    build:
      context: ./proxy
      # spa/ como contexto aparte: el Dockerfile copia de ahí solo los ficheros
      # que nombra, y el contexto principal sigue siendo proxy/.
      additional_contexts:
        spa: ./spa
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Sistema de ficheros raíz de solo lectura: lo único escribible es el
    # volumen de /data. /config no se monta: con persist_config off Caddy no
    # escribe ahí.
    read_only: true
    # Sin ninguna capability: escucha en 8443, 8444 y 8445, que no son
    # puertos privilegiados.
    cap_drop:
      - ALL
    # Impide ganar privilegios nuevos (por ejemplo con binarios setuid).
    security_opt:
      - no-new-privileges:true
    # Límites de recursos: contienen el daño de un fallo o de un abuso.
    mem_limit: 128m
    pids_limit: 64
    # Únicos puertos publicados del proyecto, y solo en 127.0.0.1 del host
    # (nunca en 0.0.0.0). 8443: la API. 8444: el sitio del denunciante, en otro
    # origen. 8445: la SPA del personal, en el suyo. Sin puerto 80.
    ports:
      - "127.0.0.1:8443:8443/tcp"
      - "127.0.0.1:8444:8444/tcp"
      - "127.0.0.1:8445:8445/tcp"
    volumes:
      # Estado que debe sobrevivir a reinicios: el CA local y los certificados.
      # Si se perdiera, el CA se regeneraría y los clientes dejarían de confiar.
      - caddy_datos:/data
    networks:
      app:
        # IP fija: es la única en la que confía uvicorn (--forwarded-allow-ips).
        ipv4_address: 10.88.0.2
      edge: {}
    # Rotación de logs: evita que crezcan sin límite y llenen el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cache:
    # Red interna: los contenedores no tienen salida a internet ni son
    # accesibles desde fuera del host.
    internal: true
  correo:
    # Red interna entre la API y el SMTP de desarrollo (mailpit): sin salida a
    # internet ni acceso desde fuera del host.
    internal: true
  data:
    # Red interna de la base de datos: sin salida a internet ni acceso desde
    # fuera del host. Solo los servicios que la necesitan se conectan a ella.
    internal: true
  app:
    # Red interna entre el proxy y la API: sin salida a internet.
    # Subred fija y pequeña (/28, 14 direcciones) para que la IP del proxy sea
    # estable. Está fuera de los rangos que Docker asigna por defecto
    # (172.17.0.0/16 a 172.31.0.0/16 y 192.168.0.0/16), así no choca con las
    # redes que Docker cree después.
    # ip_range: Docker solo asigna IPs automáticas dentro de 10.88.0.8/29 (.8 a
    # .15). Las de .2 a .7 quedan reservadas para IPs fijas; sin esto, el primer
    # contenedor en arrancar (la API) recibe la .2 y el proxy no puede tomarla
    # (comprobado: "Address already in use").
    internal: true
    ipam:
      config:
        - subnet: 10.88.0.0/28
          ip_range: 10.88.0.8/29
  edge:
    # Red de cara al exterior: la única que publica puertos (una red interna no
    # puede). Solo el proxy se conecta a ella. Subred fija por el mismo motivo y
    # para que las pruebas puedan usar un cliente de IP conocida, reservada
    # fuera del rango automático igual que en app.
    ipam:
      config:
        - subnet: 10.88.1.0/28
          ip_range: 10.88.1.8/29
  canje:
    # Red interna entre la API y el broker: sin salida a internet. Subred fija
    # porque el broker solo atiende a la IP fija de la API (.4); el broker
    # tiene la .3. De .2 a .7, IPs fijas, como en app.
    internal: true
    ipam:
      config:
        - subnet: 10.88.2.0/28
          ip_range: 10.88.2.8/29
  salida:
    # La única red con salida a internet aparte de edge, y solo para el
    # broker. No publica puertos.
    {}

